name: Build & Release APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 1b. Deploy Supabase Edge Functions ────────────────────────────────
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.22.6

      - name: Deploy nightly-renewal function
        run: supabase functions deploy nightly-renewal --project-ref pqjnkazkkagmewbaylti
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy geo-check function
        run: supabase functions deploy geo-check --project-ref pqjnkazkkagmewbaylti
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── 2. Java setup ──────────────────────────────────────────────────────
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 3. Node setup ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 4. Install JS deps ─────────────────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 5. Write env secrets ───────────────────────────────────────────────
      - name: Write .env
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_TMDB_API_KEY=${{ secrets.VITE_TMDB_API_KEY }}" >> .env

      # ── 6. Install Android SDK ─────────────────────────────────────────────
      - name: Install Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" 2>/dev/null || \
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;34.0.0"

      # ── 7. Build web bundle for Capacitor ─────────────────────────────────
      - name: Build Android web bundle
        run: npm run build:app

      # ── 8. Read version from version.json ──────────────────────────────────
      - name: Read app version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./version.json').versionName)")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      # ── 9. Patch CURRENT_VERSION in UpdateChecker ─────────────────────────
      - name: Patch UpdateChecker current version
        run: |
          VERSION=$(node -e "console.log(require('./version.json').versionName)")
          sed -i "s/const CURRENT_VERSION = \"[^\"]*\"/const CURRENT_VERSION = \"$VERSION\"/" \
            src/components/UpdateChecker.tsx

      # ── 10. Copy web assets and cap sync ──────────────────────────────────
      - name: Capacitor sync
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/. android/app/src/main/assets/public/
          npx cap sync android

      # ── 11. Fix gradle.properties for CI ──────────────────────────────────
      - name: Fix gradle.properties for CI
        run: sed -i '/org.gradle.java.home/d' android/gradle.properties

      # ── 12. Decode keystore ───────────────────────────────────────────────
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/ttflix.jks

      # ── 13. Make gradlew executable ───────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 14. Build release APK ─────────────────────────────────────────────
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 15. Rename APK ────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          echo "Found APK: $APK"
          mv "$APK" android/app/build/outputs/apk/release/ttflix.apk

      # ── 16. Assemble download page (HTML + APK + version.json) ────────────
      - name: Assemble download page + APK
        run: node scripts/deploy-download.cjs --apk android/app/build/outputs/apk/release/ttflix.apk --no-deploy

      # ── 17. Deploy to Cloudflare Pages (kellymarshall2026 / ttflix.pages.dev)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy download-page --project-name=ttflix --commit-dirty=true
